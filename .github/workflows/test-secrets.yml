name: Test GitHub Actions Security
on: [workflow_dispatch, push]

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Test 1: Can we access other repos' secrets?
      - name: "Test: List available environment variables"
        run: |
          echo "=== TESTING GITHUB ACTIONS SECURITY ==="
          echo "GITHUB_REPOSITORY: ${{ github.repository }}"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "GITHUB_TOKEN scopes: $(echo $GITHUB_TOKEN | cut -c1-10)..."
          
          # Test 2: Can we access the token's capabilities?
          - name: "Test: GitHub Token access"
            run: |
              # Check what the GITHUB_TOKEN can access
              curl -s -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/aydiler/gh-actions-security-test/actions/secrets" | head -5
