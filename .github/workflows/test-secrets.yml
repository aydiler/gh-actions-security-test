name: Test GitHub Actions Security
on: [push]

jobs:
  test-token-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test cross-repo secret access
        run: |
          echo "=== Test: GITHUB_TOKEN access ==="
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user" | python3 -c "import sys,json; d=json.load(sys.stdin); print('User: ' + d.get('login','?'))"
          
          echo "=== Test: Accessing another repo ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/vercel/turborepo")
          echo "vercel/turborepo: $CODE"
