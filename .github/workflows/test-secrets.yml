name: Test GitHub Actions Security
on: [workflow_dispatch]

jobs:
  test-token-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Test: Can we access another repo's secrets?"
        run: |
          echo "=== Test 1: Access other repo's secrets ==="
          # Try to access vercel/turborepo's secrets (public repo)
          RESULT1=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/vercel/turborepo/actions/secrets")
          echo "  vercel/turborepo secrets: $RESULT1"
          
          # Try to access our own test secret
          RESULT2=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets")
          echo "  our own secrets: $RESULT2"
      
      - name: "Test: Can we read GITHUB_TOKEN's effective user?"
        run: |
          echo "=== Test 2: GITHUB_TOKEN identity ==="
          # Who does the token belong to?
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print(f\"  Token user: {d.get('login','unknown')} (id: {d.get('id','?')})\")
print(f\"  Token scopes: {d.get('plan',{}).get('name','none')}\")
" 2>/dev/null
      
      - name: "Test: Cross-repo artifact access"
        run: |
          echo "=== Test 3: Can we access other workflows' artifacts? ==="
          # Try to list artifacts from another repo
          RESULT3=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/vercel/turborepo/actions/artifacts")
          echo "  vercel/turborepo artifacts: $RESULT3"
