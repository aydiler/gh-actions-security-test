name: Test Sensitive API Access
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test collaborator access
        run: |
          echo "=== Can we see OUR collaborators? ==="
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators" | python3 -c "
import sys, json
data = json.load(sys.stdin)
if isinstance(data, list):
    for user in data[:3]:
        print(f'  {user[\"login\"]} ({user.get(\"permissions\",{}).get(\"admin\",False) and \"admin\" or \"user\"})')
    print(f'  Total: {len(data)} collaborators')
else:
    print(f'  Error: {data}')
" 2>/dev/null
          
          echo ""
          echo "=== Can we see OTHER repos' collaborators? ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/vercel/turborepo/collaborators")
          echo "  vercel/turborepo: $CODE"
          
          CODE2=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/vercel/eve/collaborators")
          echo "  vercel/eve: $CODE2"
