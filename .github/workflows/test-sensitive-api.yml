name: API Test
on: [push]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Can we see collaborators? ==="
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(type(d).__name__, len(d) if isinstance(d,list) else 'error')"
          
          echo "=== Can we see other repo's collaborators? ==="
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/vercel/turborepo/collaborators" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message','')[:100])"
