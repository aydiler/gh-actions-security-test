name: Test Sensitive API Access
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test secret scanning access
        run: |
          echo "=== Testing sensitive API access ==="
          
          # Can we access secret scanning alerts?
          echo "Secret scanning:"
          CODE1=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/secret-scanning/alerts")
          echo "  alerts: $CODE1"
          
          # Can we access dependabot alerts?
          echo "Dependabot:"
          CODE2=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/dependabot/alerts")
          echo "  alerts: $CODE2"
          
          # Can we access code scanning?
          echo "Code scanning:"
          CODE3=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts")
          echo "  alerts: $CODE3"
          
          # Can we list repository collaborators?
          echo "Collaborators:"
          CODE4=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators")
          echo "  list: $CODE4"
